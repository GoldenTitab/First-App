flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#00FFFF"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#00FFFF"
    theme_color: "#00FFFF"

  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
